<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vielen Dank – Babel Heizungsbau</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--marine:#1B2B4D;--marine-dark:#131F38;--marine-soft:#24406E;--kupfer:#C97C4A;--kupfer-hell:#E8A87C;--kupfer-dunkel:#B36A3C;--weiss:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;color:#fff;background:radial-gradient(1200px 700px at 85% -10%,var(--marine-soft) 0%,var(--marine) 45%,var(--marine-dark) 100%);display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
.card{position:relative;max-width:620px;width:100%;text-align:center}
.check{width:84px;height:84px;border-radius:50%;background:var(--kupfer);display:flex;align-items:center;justify-content:center;margin:0 auto 32px;font-size:2.2rem;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.kicker{display:inline-block;font-family:'Manrope',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--kupfer-hell);margin-bottom:18px}
h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin-bottom:20px}
h1 em{font-style:normal;color:var(--kupfer-hell)}
p{font-size:1.1rem;line-height:1.65;color:#BECDDD;margin-bottom:34px}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 30px;border-radius:999px;font-family:'Manrope',sans-serif;font-weight:700;font-size:.95rem;text-decoration:none;transition:all .25s}
.btn-primary{background:var(--kupfer);color:#fff;box-shadow:0 10px 30px rgba(201,124,74,.4)}
.btn-primary:hover{background:var(--kupfer-dunkel);transform:translateY(-2px)}
.btn-ghost{color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<main class="card">
  <div class="check">✓</div>
  <span class="kicker">Anfrage eingegangen</span>
  <h1>Vielen Dank!<br><em>Wir melden uns bei Ihnen.</em></h1>
  <p>Ihre Anfrage ist bei uns angekommen. Innerhalb von 24 Stunden an Werktagen meldet sich Louis Babel persönlich bei Ihnen – per Telefon, WhatsApp oder E-Mail, ganz wie gewünscht.</p>
  <div class="btns">
    <a class="btn btn-primary" href="/">Zurück zur Startseite</a>
    <a class="btn btn-ghost" href="tel:+4915738803691">☎ 0157 38803691</a>
  </div>
</main>
</body>
</html>
