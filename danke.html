<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vielen Dank – Babel Heizungsbau</title>
<meta name="robots" content="noindex">
<meta property="og:image" content="https://www.heizungsbau-babel.de/images/og-heizungsbau-babel.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.heizungsbau-babel.de/images/og-heizungsbau-babel.jpg">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="/consent.js" defer></script>
<style>
:root{--marine:#1B2B4D;--marine-dark:#131F38;--marine-soft:#24406E;--kupfer:#C97C4A;--kupfer-hell:#E8A87C;--kupfer-dunkel:#B36A3C;--weiss:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;color:#fff;background:radial-gradient(1200px 700px at 85% -10%,var(--marine-soft) 0%,var(--marine) 45%,var(--marine-dark) 100%);display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
.card{position:relative;max-width:620px;width:100%;text-align:center}
.check{width:84px;height:84px;border-radius:50%;background:var(--kupfer);display:flex;align-items:center;justify-content:center;margin:0 auto 32px;font-size:2.2rem;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.kicker{display:inline-block;font-family:'Manrope',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--kupfer-hell);margin-bottom:18px}
h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin-bottom:20px}
h1 em{font-style:normal;color:var(--kupfer-hell)}
p{font-size:1.1rem;line-height:1.65;color:#BECDDD;margin-bottom:34px}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 30px;border-radius:999px;font-family:'Manrope',sans-serif;font-weight:700;font-size:.95rem;text-decoration:none;transition:all .25s}
.btn-primary{background:var(--kupfer);color:#fff;box-shadow:0 10px 30px rgba(201,124,74,.4)}
.btn-primary:hover{background:var(--kupfer-dunkel);transform:translateY(-2px)}
.btn-ghost{color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.08)}

#hb-consent{position:fixed;left:16px;right:16px;bottom:16px;z-index:300;display:flex;justify-content:center;pointer-events:none}
#hb-consent .hbc-box{pointer-events:auto;max-width:720px;width:100%;background:#fff;border:1px solid var(--linie);border-radius:18px;box-shadow:0 24px 70px rgba(19,31,56,.22);padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#hb-consent p{margin:0;flex:1 1 360px;font-size:.92rem;line-height:1.55;color:var(--text)}
#hb-consent a{color:var(--blau)}
#hb-consent .hbc-btns{display:flex;gap:10px;flex:0 0 auto}
#hb-consent button{font-family:'Manrope',sans-serif;font-weight:700;font-size:.9rem;padding:11px 18px;border-radius:100px;cursor:pointer;border:1.5px solid var(--marine)}
#hb-consent .hbc-accept{background:var(--kupfer);border-color:var(--kupfer);color:#fff}
#hb-consent .hbc-decline{background:#fff;color:var(--marine)}
@media(max-width:700px){#hb-consent{bottom:84px}#hb-consent .hbc-btns{width:100%}#hb-consent button{flex:1}}
</style>
</head>
<body>
<main class="card">
  <div class="check">✓</div>
  <span class="kicker">Anfrage eingegangen</span>
  <h1>Vielen Dank!<br><em>Wir melden uns bei Ihnen.</em></h1>
  <p>Ihre Anfrage ist bei uns angekommen. Innerhalb von 24 Stunden an Werktagen meldet sich Louis Babel persönlich bei Ihnen – per WhatsApp, E-Mail oder Telefon.</p>
  <div class="btns">
    <a class="btn btn-primary" href="/">Zurück zur Startseite</a>
    <a class="btn btn-ghost" href="https://wa.me/4915738803691?text=Hallo%2C%20ich%20interessiere%20mich%20f%C3%BCr%20eine%20Beratung.">WhatsApp schreiben</a>
  </div>
</main>
</body>
</html>
